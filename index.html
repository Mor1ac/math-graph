<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильный Графпостроитель</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#07090e',
                            card: '#0f1420',
                            border: 'rgba(0, 240, 255, 0.2)',
                            cyan: '#00f0ff',
                            pink: '#ff007f',
                            purple: '#9d00ff',
                            green: '#00ff66',
                            yellow: '#ffe600'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #07090e;
            color: #f3f4f6;
            touch-action: none;
        }
        canvas {
            touch-action: none;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 20, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }
        .glow-text-cyan {
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }
        .glow-border-cyan {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(7, 9, 14, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col overflow-hidden bg-cyber-bg text-gray-100">

    <!-- Верхняя плавающая инфо-панель -->
    <header class="absolute top-3 left-3 right-3 z-20 flex items-center justify-between pointer-events-none">
        <div class="glass-panel pointer-events-auto px-3 py-1.5 rounded-2xl flex items-center space-x-3 text-xs font-mono shadow-2xl">
            <div class="flex items-center space-x-1">
                <span class="text-gray-500">X:</span>
                <span id="coordX" class="text-cyber-cyan font-bold w-12 text-left">0.00</span>
            </div>
            <div class="flex items-center space-x-1 border-l border-gray-800 pl-2">
                <span class="text-gray-500">Y:</span>
                <span id="coordY" class="text-cyber-cyan font-bold w-12 text-left">0.00</span>
            </div>
            <div class="hidden sm:flex items-center space-x-1 border-l border-gray-800 pl-2">
                <span class="text-gray-500">Сетка:</span>
                <span id="gridScale" class="text-cyber-green font-semibold">1 ед</span>
            </div>
        </div>

        <div class="flex items-center space-x-2 pointer-events-auto">
            <button id="resetViewBtn" title="Сброс масштаба и центра" class="glass-panel p-2.5 rounded-2xl text-cyber-cyan hover:bg-slate-800/80 active:scale-95 transition-all shadow-xl">
                <i data-lucide="crosshair" class="w-5 h-5"></i>
            </button>
            <button id="toggleUIBtn" title="Свернуть/Развернуть меню" class="glass-panel p-2.5 rounded-2xl text-gray-300 hover:text-white active:scale-95 transition-all shadow-xl md:hidden">
                <i data-lucide="sliders" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Главный Canvas (занимает всё пространство) -->
    <main class="relative flex-1 w-full h-full overflow-hidden">
        <canvas id="graphCanvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>
    </main>

    <!-- Нижняя мобильная плавающая панель управления -->
    <footer id="controlPanel" class="glass-panel fixed bottom-0 left-0 right-0 z-30 rounded-t-3xl border-t border-cyber-border shadow-2xl transition-transform duration-300 max-h-[85vh] flex flex-col">
        
        <!-- Ползунок-ручка для удобного перетаскивания панельки на смартфонах -->
        <div id="panelHeader" class="w-full py-2 flex flex-col items-center justify-center cursor-pointer select-none">
            <div class="w-12 h-1.5 bg-gray-700/80 rounded-full mb-1"></div>
            <div class="flex items-center justify-between w-full px-5">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyber-cyan shadow-[0_0_8px_#00f0ff]"></span>
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-300">Функции & Управление</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="addFuncBtn" class="px-2.5 py-1 bg-cyber-cyan/10 border border-cyber-cyan/40 hover:bg-cyber-cyan/20 text-cyber-cyan text-xs rounded-xl flex items-center space-x-1 font-semibold transition-all">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>График</span>
                    </button>
                    <i data-lucide="chevron-up" id="collapseIcon" class="w-4 h-4 text-gray-400 transition-transform"></i>
                </div>
            </div>
        </div>

        <!-- Контент панели -->
        <div id="panelBody" class="p-4 pt-1 space-y-3 overflow-y-auto max-h-[70vh]">
            
            <!-- Список активных функций -->
            <div id="functionsList" class="space-y-2">
                <!-- Заполняется динамически -->
            </div>

            <!-- Мобильная виртуальная математическая клавиатура -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Математическая клавиатура</span>
                    <span class="text-[10px] text-gray-500">Быстрый набор</span>
                </div>
                <div class="grid grid-cols-6 gap-1.5 font-mono text-xs">
                    <button onclick="insertMath('x')" class="p-2.5 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-cyber-cyan font-bold active:scale-95">x</button>
                    <button onclick="insertMath('^2')" class="p-2.5 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">x²</button>
                    <button onclick="insertMath('sqrt(')" class="p-2.5 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">√x</button>
                    <button onclick="insertMath('1/(')" class="p-2.5 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">1/x</button>
                    <button onclick="insertMath('^')" class="p-2.5 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">xⁿ</button>
                    <button onclick="backspaceMath()" class="p-2.5 bg-pink-950/40 hover:bg-pink-900/60 border border-pink-800/50 rounded-xl text-pink-400 font-bold active:scale-95 flex items-center justify-center">
                        <i data-lucide="delete" class="w-4 h-4"></i>
                    </button>

                    <button onclick="insertMath('sin(')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-300 text-[11px] active:scale-95">sin</button>
                    <button onclick="insertMath('cos(')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-300 text-[11px] active:scale-95">cos</button>
                    <button onclick="insertMath('tan(')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-300 text-[11px] active:scale-95">tan</button>
                    <button onclick="insertMath('abs(')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-300 text-[11px] active:scale-95">|x|</button>
                    <button onclick="insertMath('(')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">(</button>
                    <button onclick="insertMath(')')" class="p-2 bg-slate-900/90 hover:bg-slate-800 border border-gray-800 rounded-xl text-gray-200 active:scale-95">)</button>
                </div>
            </div>

            <!-- Шаблоны функций -->
            <div class="space-y-1.5 pt-1">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-1">Шаблоны</span>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                    <button onclick="setPreset('x^2 - 4')" class="p-2 bg-slate-900/60 border border-gray-800 hover:border-cyber-cyan/50 rounded-xl text-xs font-mono text-gray-300 text-left flex justify-between items-center">
                        <span>Парабола</span>
                        <span class="text-cyber-cyan text-[10px]">x²-4</span>
                    </button>
                    <button onclick="setPreset('1/x')" class="p-2 bg-slate-900/60 border border-gray-800 hover:border-cyber-cyan/50 rounded-xl text-xs font-mono text-gray-300 text-left flex justify-between items-center">
                        <span>Гипербола</span>
                        <span class="text-cyber-pink text-[10px]">1/x</span>
                    </button>
                    <button onclick="setPreset('sin(x)')" class="p-2 bg-slate-900/60 border border-gray-800 hover:border-cyber-cyan/50 rounded-xl text-xs font-mono text-gray-300 text-left flex justify-between items-center">
                        <span>Синусоида</span>
                        <span class="text-cyber-yellow text-[10px]">sin(x)</span>
                    </button>
                    <button onclick="setPreset('2*x + 1')" class="p-2 bg-slate-900/60 border border-gray-800 hover:border-cyber-cyan/50 rounded-xl text-xs font-mono text-gray-300 text-left flex justify-between items-center">
                        <span>Прямая</span>
                        <span class="text-cyber-green text-[10px]">2x+1</span>
                    </button>
                </div>
            </div>

            <!-- Раскрывающаяся Таблица значений X/Y и Экстремумы -->
            <details class="group bg-slate-900/60 border border-gray-800 rounded-2xl overflow-hidden">
                <summary class="p-3 text-xs font-semibold text-gray-300 flex justify-between items-center cursor-pointer select-none">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="table" class="w-4 h-4 text-cyber-cyan"></i>
                        <span>Таблица значений X | Y & Экстремумы</span>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 group-open:rotate-180 transition-transform"></i>
                </summary>
                <div class="p-3 border-t border-gray-800 space-y-3">
                    <div id="keyPointsContainer" class="space-y-1.5">
                        <span class="text-[10px] text-gray-400 font-semibold uppercase">Особые точки на экране:</span>
                        <div id="keyPointsList" class="flex flex-wrap gap-1.5 text-xs">
                            <!-- Заполняется динамически -->
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span>Шаг таблицы X:</span>
                            <input type="number" id="tableStepInput" value="1" step="0.5" class="w-16 bg-slate-950 border border-gray-800 rounded-lg px-2 py-1 text-center font-mono text-white">
                        </div>
                        <div class="max-h-36 overflow-y-auto rounded-xl border border-gray-800">
                            <table class="w-full text-xs font-mono text-left">
                                <thead class="bg-slate-950 text-cyber-cyan sticky top-0">
                                    <tr>
                                        <th class="p-2 border-b border-gray-800">X</th>
                                        <th class="p-2 border-b border-gray-800">Y = f(x)</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody" class="divide-y divide-slate-800/60 text-gray-300">
                                    <!-- Заполняется динамически -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </details>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        const coordXEl = document.getElementById('coordX');
        const coordYEl = document.getElementById('coordY');
        const gridScaleEl = document.getElementById('gridScale');
        const functionsListEl = document.getElementById('functionsList');
        const keyPointsListEl = document.getElementById('keyPointsList');
        const tableBodyEl = document.getElementById('tableBody');
        const tableStepInput = document.getElementById('tableStepInput');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const addFuncBtn = document.getElementById('addFuncBtn');
        const controlPanel = document.getElementById('controlPanel');
        const panelHeader = document.getElementById('panelHeader');
        const toggleUIBtn = document.getElementById('toggleUIBtn');
        const collapseIcon = document.getElementById('collapseIcon');

        // Палитра неоновых цветов для графиков
        const COLORS = ['#00f0ff', '#ff007f', '#00ff66', '#ffe600', '#9d00ff', '#ffa500'];

        // Состояние приложения
        let scale = 40; // Пикселей в 1 ед. (1:1 масштаб)
        let offsetX = 0;
        let offsetY = 0;

        let activeInputId = null; // Текущее активное поле ввода
        let isPanelCollapsed = false;

        // Массив функций
        let functions = [
            { id: 1, expr: 'x^2 - 4', color: COLORS[0], parsedFn: null, visible: true },
            { id: 2, expr: '1/x', color: COLORS[1], parsedFn: null, visible: true }
        ];

        // 1. Настройка размера Canvas
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // 2. Парсинг математических функций
        function compileFunction(expr) {
            if (!expr || expr.trim() === '') return null;
            let parsed = expr.trim();

            // Автоматическая подстановка умножения: 2x -> 2*x, 3( -> 3*(
            parsed = parsed.replace(/(\d)([a-zA-Z\(])/g, '$1*$2');
            parsed = parsed.replace(/(\))(\d|[a-zA-Z\(])/g, '$1*$2');
            
            // Степени: x^2 -> Math.pow(x, 2)
            parsed = parsed.replace(/([a-zA-Z0-9_\.\)]+)\s*\^\s*([a-zA-Z0-9_\.\)]+)/g, 'Math.pow($1, $2)');

            // Математические функции
            parsed = parsed.replace(/\bsqrt\b/g, 'Math.sqrt');
            parsed = parsed.replace(/\bsin\b/g, 'Math.sin');
            parsed = parsed.replace(/\bcos\b/g, 'Math.cos');
            parsed = parsed.replace(/\btan\b/g, 'Math.tan');
            parsed = parsed.replace(/\babs\b/g, 'Math.abs');
            parsed = parsed.replace(/\blog\b/g, 'Math.log');
            parsed = parsed.replace(/\bpi\b/gi, 'Math.PI');
            parsed = parsed.replace(/\be\b/gi, 'Math.E');

            try {
                const fn = new Function('x', `
                    try {
                        with (Math) {
                            const y = ${parsed};
                            return isNaN(y) ? NaN : y;
                        }
                    } catch(e) {
                        return NaN;
                    }
                `);
                fn(1); // Тестовый запуск
                return fn;
            } catch (err) {
                return null;
            }
        }

        function updateAllFunctions() {
            functions.forEach(f => {
                f.parsedFn = compileFunction(f.expr);
            });
            draw();
            updateTableAndPoints();
        }

        // 3. Динамическая генерация списка функций в UI
        function renderFunctionsList() {
            functionsListEl.innerHTML = '';
            functions.forEach((f, idx) => {
                const item = document.createElement('div');
                item.className = 'flex items-center space-x-2 bg-slate-900/90 p-2 rounded-2xl border border-gray-800';
                item.innerHTML = `
                    <button onclick="toggleVisibility(${f.id})" class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0" style="background-color: ${f.color}20; border: 1px solid ${f.color}">
                        <div class="w-2.5 h-2.5 rounded-full ${f.visible ? '' : 'opacity-20'}" style="background-color: ${f.color}"></div>
                    </button>
                    <span class="text-xs font-mono font-bold shrink-0" style="color: ${f.color}">y =</span>
                    <input type="text" id="funcInput_${f.id}" value="${f.expr}" placeholder="например x^2"
                        onfocus="setActiveInput(${f.id})"
                        oninput="onInputExpr(${f.id}, this.value)"
                        class="w-full bg-transparent text-xs font-mono text-white focus:outline-none placeholder-gray-600" />
                    ${functions.length > 1 ? `
                        <button onclick="removeFunction(${f.id})" class="text-gray-500 hover:text-pink-500 p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                `;
                functionsListEl.appendChild(item);
            });
            lucide.createIcons();
        }

        function setActiveInput(id) {
            activeInputId = id;
        }

        function onInputExpr(id, val) {
            const f = functions.find(item => item.id === id);
            if (f) {
                f.expr = val;
                f.parsedFn = compileFunction(val);
                draw();
                updateTableAndPoints();
            }
        }

        function toggleVisibility(id) {
            const f = functions.find(item => item.id === id);
            if (f) {
                f.visible = !f.visible;
                renderFunctionsList();
                draw();
            }
        }

        function removeFunction(id) {
            if (functions.length <= 1) return;
            functions = functions.filter(f => f.id !== id);
            renderFunctionsList();
            updateAllFunctions();
        }

        addFuncBtn.onclick = () => {
            const newId = Date.now();
            const color = COLORS[functions.length % COLORS.length];
            functions.push({ id: newId, expr: 'sin(x)', color: color, parsedFn: compileFunction('sin(x)'), visible: true });
            renderFunctionsList();
            updateAllFunctions();
        };

        // 4. Отрисовка координатной сетки 1:1
        function getGridStep() {
            if (scale < 12) return 10;
            if (scale < 25) return 5;
            if (scale < 60) return 1;
            if (scale < 150) return 0.5;
            if (scale < 350) return 0.2;
            return 0.1;
        }

        function drawGrid(centerX, centerY, width, height) {
            const stepUnit = getGridStep();
            const stepPx = stepUnit * scale;

            gridScaleEl.textContent = `${stepUnit} ед`;

            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();

            const startX = Math.floor((-centerX) / stepPx) * stepPx + centerX;
            for (let x = startX; x < width; x += stepPx) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }

            const startY = Math.floor((-centerY) / stepPx) * stepPx + centerY;
            for (let y = startY; y < height; y += stepPx) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
        }

        function drawAxes(centerX, centerY, width, height) {
            const stepUnit = getGridStep();
            const stepPx = stepUnit * scale;

            // Оси
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 6;

            ctx.beginPath();
            ctx.moveTo(0, centerY); ctx.lineTo(width, centerY);
            ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Засечки и подписи координат
            ctx.font = '10px monospace';
            ctx.fillStyle = '#64748b';

            const startX = Math.floor((-centerX) / stepPx) * stepPx + centerX;
            for (let x = startX; x < width; x += stepPx) {
                const mathX = (x - centerX) / scale;
                if (Math.abs(mathX) > 0.0001) {
                    ctx.fillText(Number(mathX.toFixed(2)), x - 8, Math.min(Math.max(centerY + 14, 15), height - 10));
                }
            }

            const startY = Math.floor((-centerY) / stepPx) * stepPx + centerY;
            for (let y = startY; y < height; y += stepPx) {
                const mathY = -(y - centerY) / scale;
                if (Math.abs(mathY) > 0.0001) {
                    ctx.fillText(Number(mathY.toFixed(2)), Math.min(Math.max(centerX + 6, 10), width - 30), y + 4);
                }
            }
        }

        // 5. Отрисовка графиков с авто-определением разрывов (асимптот)
        function drawGraph(f, centerX, centerY, width, height) {
            if (!f.parsedFn || !f.visible) return;

            ctx.strokeStyle = f.color;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = f.color;
            ctx.shadowBlur = 8;

            ctx.beginPath();
            let drawing = false;
            let prevPixelY = null;

            const stepPx = 1; // Шаг по пикселям для гладкости

            for (let pixelX = 0; pixelX <= width; pixelX += stepPx) {
                const mathX = (pixelX - centerX) / scale;
                let mathY;

                try {
                    mathY = f.parsedFn(mathX);
                } catch (e) {
                    mathY = NaN;
                }

                const pixelY = centerY - mathY * scale;
                const isValid = !isNaN(mathY) && isFinite(mathY) && Math.abs(pixelY) < height * 8;

                // Детекция вертикальных асимптот (гиперболы 1/x, tg)
                let isAsymptote = false;
                if (isValid && prevPixelY !== null) {
                    if (Math.abs(pixelY - prevPixelY) > height * 0.7) {
                        isAsymptote = true;
                    }
                }

                if (isValid && !isAsymptote) {
                    if (!drawing) {
                        ctx.moveTo(pixelX, pixelY);
                        drawing = true;
                    } else {
                        ctx.lineTo(pixelX, pixelY);
                    }
                    prevPixelY = pixelY;
                } else {
                    drawing = false;
                    prevPixelY = null;
                }
            }

            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 6. Главная функция отрисовки
        function draw() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2 + offsetX;
            const centerY = height / 2 + offsetY;

            drawGrid(centerX, centerY, width, height);
            drawAxes(centerX, centerY, width, height);

            functions.forEach(f => drawGraph(f, centerX, centerY, width, height));
            drawKeyPointsOnCanvas(centerX, centerY, width, height);
        }

        // 7. Поиск особых точек
        function drawKeyPointsOnCanvas(centerX, centerY, width, height) {
            const firstActive = functions.find(f => f.parsedFn && f.visible);
            if (!firstActive) return;

            const minX = (-centerX) / scale;
            const maxX = (width - centerX) / scale;
            const step = (maxX - minX) / 150;

            let prevX = minX;
            let prevY = firstActive.parsedFn(minX);

            keyPointsListEl.innerHTML = '';

            for (let i = 1; i <= 150; i++) {
                const x = minX + i * step;
                const y = firstActive.parsedFn(x);

                if (isFinite(prevY) && isFinite(y)) {
                    // Пересечение с X
                    if (prevY * y <= 0) {
                        const rootX = prevX - prevY * (x - prevX) / (y - prevY);
                        addPointBadge('Корень', rootX, 0, '#00ff66');
                        drawPointCircle(centerX + rootX * scale, centerY, '#00ff66');
                    }
                }
                prevX = x;
                prevY = y;
            }

            // Пересечение с Y
            const y0 = firstActive.parsedFn(0);
            if (isFinite(y0)) {
                addPointBadge('Ось Y', 0, y0, '#00f0ff');
                drawPointCircle(centerX, centerY - y0 * scale, '#00f0ff');
            }
        }

        function drawPointCircle(px, py, color) {
            if (px >= 0 && px <= window.innerWidth && py >= 0 && py <= window.innerHeight) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#07090e';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function addPointBadge(label, x, y, color) {
            const badge = document.createElement('div');
            badge.className = 'px-2 py-1 bg-slate-950 border border-gray-800 rounded-lg font-mono text-[10px] text-gray-300';
            badge.innerHTML = `<span style="color: ${color}">${label}:</span> (${x.toFixed(2)}, ${y.toFixed(2)})`;
            keyPointsListEl.appendChild(badge);
        }

        function updateTableAndPoints() {
            tableBodyEl.innerHTML = '';
            const firstActive = functions.find(f => f.parsedFn && f.visible);
            if (!firstActive) return;

            const step = parseFloat(tableStepInput.value) || 1;
            for (let x = -5; x <= 5; x += step) {
                const y = firstActive.parsedFn(x);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40';
                tr.innerHTML = `
                    <td class="p-1.5 border-b border-gray-800/60 text-cyber-cyan">${x.toFixed(1)}</td>
                    <td class="p-1.5 border-b border-gray-800/60">${isFinite(y) ? y.toFixed(3) : '—'}</td>
                `;
                tableBodyEl.appendChild(tr);
            }
        }

        // 8. Сенсорное управление для смартфонов (Touch, Pinch-to-zoom, Pan, Double Tap)
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let initialPinchDist = null;
        let lastTapTime = 0;

        // Координаты пальца/курсора
        function updateCursorCoords(clientX, clientY) {
            const centerX = window.innerWidth / 2 + offsetX;
            const centerY = window.innerHeight / 2 + offsetY;
            const mathX = (clientX - centerX) / scale;
            const mathY = -(clientY - centerY) / scale;
            coordXEl.textContent = mathX.toFixed(2);
            coordYEl.textContent = mathY.toFixed(2);
        }

        // События Мыши (ПК)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX - offsetX;
            dragStartY = e.clientY - offsetY;
        });

        window.addEventListener('mousemove', (e) => {
            updateCursorCoords(e.clientX, e.clientY);
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                draw();
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            if (scale * zoomFactor > 2 && scale * zoomFactor < 4000) {
                scale *= zoomFactor;
                draw();
            }
        }, { passive: false });

        // Сенсорные события (Смартфоны/Планшеты)
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX - offsetX;
                dragStartY = e.touches[0].clientY - offsetY;
                updateCursorCoords(e.touches[0].clientX, e.touches[0].clientY);

                // Двойной тап для сброса вида
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    scale = 40;
                    offsetX = 0;
                    offsetY = 0;
                    draw();
                }
                lastTapTime = now;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                offsetX = e.touches[0].clientX - dragStartX;
                offsetY = e.touches[0].clientY - dragStartY;
                updateCursorCoords(e.touches[0].clientX, e.touches[0].clientY);
                draw();
            } else if (e.touches.length === 2 && initialPinchDist) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = currentDist / initialPinchDist;
                if (scale * factor > 2 && scale * factor < 4000) {
                    scale *= factor;
                    initialPinchDist = currentDist;
                    draw();
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            initialPinchDist = null;
        });

        // 9. Виртуальная клавиатура
        function insertMath(str) {
            let targetId = activeInputId || (functions[0] ? functions[0].id : null);
            if (!targetId) return;

            const input = document.getElementById(`funcInput_${targetId}`);
            if (!input) return;

            const start = input.selectionStart || input.value.length;
            const end = input.selectionEnd || input.value.length;
            const val = input.value;

            input.value = val.substring(0, start) + str + val.substring(end);
            input.focus();
            input.setSelectionRange(start + str.length, start + str.length);

            onInputExpr(targetId, input.value);
        }

        function backspaceMath() {
            let targetId = activeInputId || (functions[0] ? functions[0].id : null);
            if (!targetId) return;

            const input = document.getElementById(`funcInput_${targetId}`);
            if (!input) return;

            const start = input.selectionStart;
            const end = input.selectionEnd;
            const val = input.value;

            if (start === end && start > 0) {
                input.value = val.substring(0, start - 1) + val.substring(start);
                input.setSelectionRange(start - 1, start - 1);
            } else if (start !== end) {
                input.value = val.substring(0, start) + val.substring(end);
                input.setSelectionRange(start, start);
            }
            input.focus();
            onInputExpr(targetId, input.value);
        }

        function setPreset(expr) {
            if (functions.length > 0) {
                functions[0].expr = expr;
                renderFunctionsList();
                updateAllFunctions();
            }
        }

        // 10. Управление интерфейсом панельки
        function togglePanel() {
            isPanelCollapsed = !isPanelCollapsed;
            if (isPanelCollapsed) {
                controlPanel.style.transform = 'translateY(calc(100% - 44px))';
                collapseIcon.style.transform = 'rotate(180deg)';
            } else {
                controlPanel.style.transform = 'translateY(0)';
                collapseIcon.style.transform = 'rotate(0deg)';
            }
        }

        panelHeader.onclick = togglePanel;
        toggleUIBtn.onclick = togglePanel;

        resetViewBtn.onclick = () => {
            scale = 40;
            offsetX = 0;
            offsetY = 0;
            draw();
        };

        tableStepInput.onchange = updateTableAndPoints;

        // Инициализация при старте
        window.onload = () => {
            resizeCanvas();
            renderFunctionsList();
            updateAllFunctions();
        };
    </script>
</body>
</html>
